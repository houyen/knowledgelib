# policy.yaml — NGUỒN CHÂN LÝ DUY NHẤT (PoC vendor-neutral).
# Lõi `bin/llmwiki-validate.py` và `gen-converters.py` đều đọc file này.
#
# enforce_at: 'session' = lúc agent định ghi (hook/CLI chặn ngay).
#             'repo'    = lúc commit/PR (pre-commit + CI).
# Đây là chỗ DÀY tùy ý — thêm luật ở đây, KHÔNG sửa code adapter.
#
# 2026-10-15: rút gọn 22 → 6 rule. Bỏ R1,R2,R3,R5,R6,R7,R9,R10,R11,R12,R13,R14,R15,R16,R17,R18
# (llmwiki/ADR/proposal/pull-gate — không repo nào có đối tượng để cắn, audit log 0 lần khớp).
# ID giữ nguyên số cũ để lịch sử/commit cũ còn tra được; khoảng trống là chủ ý.

version: 1

rules:
  # ── Hook-event rules ────────────────────────────────────────────────────────
  # Enforce bằng HOOK SỰ KIỆN (không phải content-check) → kind `hook_event`,
  # llmwiki-validate bỏ qua an toàn. gen-converters SINH hook từ đây.
  audit_log:
    id: R4
    name: audit-log
    kind: hook_event
    statement: "Mọi tool-call ghi .claude/audit/audit.jsonl (timestamp) + sinh log.md người-đọc-được. Không chặn."
    enforce_at: [session]
    event: PostToolUse
    event_action: audit
    matcher: "Write|Edit|MultiEdit"
    timeout: 10
    handler: "harness-events.py audit · llmwiki/.claude/hooks/post_tool_use.py"
    blocking: false

  session_health:
    id: R8
    name: session-health
    kind: hook_event
    statement: "Đầu phiên: báo số rule đang gác + CHECK DRIFT policy/version vs remote (cảnh báo nếu lệch → /sync-template). Không chặn."
    enforce_at: [session]
    event: SessionStart
    event_action: session
    timeout: 10
    handler: "harness-events.py session · llmwiki/.claude/hooks/session_start.py (health-check.py)"
    blocking: false

  # ── KnowledgeLib bridge (T2 2026-09-17) ─────────────────────────────────
  knowledgelib_nudge:
    id: R19
    name: knowledgelib-nudge
    kind: hook_event
    statement: "Mỗi N prompt (default 5): nhắc agent cân nhắc gọi MCP tool knowledgelib_search khi gặp câu hỏi domain-knowledge. NGUYÊN TẮC: KnowledgeLib là dữ liệu user đã làm qua, dùng làm nền và tài liệu tham khảo, KHÔNG phụ thuộc tuyệt đối (có thể là kiến thức cơ bản hoặc đã cũ) — AI PHẢI chủ động đối chiếu và bổ sung thêm kiến thức hiện đại, chuyên sâu của AI. Báo cáo, không chặn."
    enforce_at: [session]
    event: UserPromptSubmit
    event_action: knowledgelib
    timeout: 10
    handler: "harness-events.py knowledgelib · bin/harness-events.py::m_knowledgelib. KnowledgeLib MCP server đăng ký GLOBAL (~/.claude.json), không phải per-project."
    blocking: false

  # ── KnowledgeLib self-docs canonical & auto-sync (Phase 7) ──────────────
  self_docs_canonical:
    id: R20
    name: self-docs-canonical
    kind: require_frontmatter
    statement: "Tài liệu trong self-docs/ phải tuân thủ chuẩn Canonical KnowledgeLib: có frontmatter gồm 6 trường [id, canonical_question, aliases, entity_type, domain, last_verified] và body không rỗng."
    enforce_at: [session, repo]
    target_globs:
      - "self-docs/**/*.md"
      - "self-docs/*.md"
    exclude_basenames:
      - "MEMORY_INDEX.md"
      - "00-START-HERE.md"
      - "README.md"
      - "document-map.md"
    require_keys:
      - id
      - canonical_question
      - aliases
      - entity_type
      - domain
      - last_verified
    valid_entity_types:
      - concept
      - rule
      - runbook
      - gotchas
      - architecture_explainer
      - troubleshooting
      - how_to
      - reference
      - specification
      - product_comparison
      - tech_stack
      - compliance
      - business_strategy
      - finance
      - faq
    require_body: true

  self_docs_sync:
    id: R21
    name: self-docs-sync
    kind: hook_event
    statement: "Tự động trích xuất và đồng bộ file self-docs/ sang KnowledgeLib tập trung khi kết thúc phiên hoặc lưu tài liệu. Báo cáo, không chặn."
    enforce_at: [session]
    event: Stop
    event_action: knowledgelib-sync
    timeout: 30
    handler: "harness-events.py knowledgelib-sync · bin/harness-events.py::m_knowledgelib_sync"
    blocking: false

  # ── Browser policy (2026-09-21) ─────────────────────────────────────────
  orca_browser_only:
    id: R22
    name: orca-browser-only
    kind: hook_event
    statement: "Cần mở trình duyệt (mở trang, test UI/E2E, chụp màn hình, link OAuth/verify) thì dùng browser tích hợp của Orca qua `orca tab create --url ...` / `orca goto` / `orca snapshot`. CẤM mở trình duyệt mặc định của hệ thống: `open <url|file.html>`, `open -a <browser>`, `xdg-open`, `python -m webbrowser`, `osascript ... open location`. Site chặn browser nhúng (vd Google sign-in) → KHÔNG tự chuyển sang trình duyệt hệ thống, in URL cho user tự dán. Tạm mở khoá bằng env HARNESS_ALLOW_SYSTEM_BROWSER=1."
    enforce_at: [session]
    event: PreToolUse
    event_action: browser-guard
    matcher: Bash
    timeout: 10
    handler: "harness-events.py browser-guard · bin/harness-events.py::m_browser_guard (chặn exit 2; lỗi → fail-open). Chỉ soi lệnh ở đầu mỗi đoạn shell, không soi chuỗi nằm trong tham số (tránh chặn nhầm `git commit -m \"...open http...\"`)."
    blocking: true
