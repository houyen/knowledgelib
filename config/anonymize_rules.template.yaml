    - "lương"
  integration:
    - "api"
    - "webhook"
    - "adapter"
    - "integration"
    - "sftp"
    - "soap"
    - "rest"
    - "workday"
    - "tích hợp"
  security:
    - "rbac"
    - "auth"
    - "permission"
    - "jwt"
    - "token"
    - "audit"
    - "security"
    - "compliance"
    - "bảo mật"
    - "phân quyền"
  database:
    - "db"
    - "database"
    - "schema"
    - "migration"
    - "table"
    - "sql"
    - "postgres"
    - "mongodb"
    - "atlas"
    - "redis"
  operations:
    - "runbook"
    - "deploy"
    - "attendance"
    - "report"
    - "export"
    - "vận hành"
    - "triển khai"
